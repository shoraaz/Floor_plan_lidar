# Compliance matrix: requirement -> file path -> artifact -> status
# status: done | partial | not_done   (honest; numbers live in benchmark/results and the report)
# Scope: organisers' sample data (3 Stray captures, no GT) + own benchmark from Apple ARKitScenes venue 470350
# (3 iPad-LiDAR captures, Faro laser ground truth, converted to Stray format). Substitution: no own device/room.
requirements:
  - id: R-CAP
    text: Capture route + device matrix
    path: docs/CAPTURE_PROTOCOL.md, docs/DEVICE_MATRIX.md
    artifact: Route 2 stock protocol (Stray Scanner / native camera)
    status: done
  - id: R-TIER-LIDAR
    text: LiDAR tier (depth, poses, intrinsics)
    path: src/roomscan/tiers/lidar.py, src/roomscan/geometry/*
    artifact: out/bench/lidar/*/plan.json
    status: done
  - id: R-TIER-VIDEO
    text: Video tier from a handheld clip
    path: src/roomscan/tiers/video.py, src/roomscan/geometry/da3_frontend.py
    artifact: out/bench/video/*/plan.json, benchmark/results/video/*
    status: partial   # runs end-to-end; accuracy below the +/-3% gate (see report)
  - id: R-TIER-PHOTO
    text: Photo tier, per-room folders -> one stitched plan
    path: src/roomscan/tiers/photo.py, scripts/make_photo_folders.py
    artifact: out/bench/photo/*/plan.json
    status: partial   # photos taken from the sample clips (no separate photo sets provided)
  - id: R-OUT-ROOM
    text: Per-room walls, ceiling height, floor area
    path: src/roomscan/geometry/backend.py, snap.py
    artifact: plan.json rooms[]
    status: done      # ceiling reported null when not observed (never guessed)
  - id: R-OUT-OPENINGS
    text: Openings (doors/windows) with widths
    path: src/roomscan/geometry/rooms.py (doorway gaps detected for segmentation only)
    artifact: plan.json rooms[].openings, benchmark/results/door_repeat_lidar.txt
    status: partial   # doors between two rooms emitted (frame-face widths); not repeatable across captures; no windows
  - id: R-OUT-STITCH
    text: Stitched multi-room plan, adjacency, no overlaps
    path: src/roomscan/geometry/stitch.py
    artifact: plan.json adjacency, footprint_m2, plan.svg
    status: done
  - id: R-OUT-DAMAGE
    text: Damage regions with class and metric extent
    path: src/roomscan/damage.py
    artifact: plan.json rooms[].damage (empty)
    status: not_done
  - id: R-OUT-CONCEAL
    text: Concealed-damage flags with rule
    path: src/roomscan/rules.py
    artifact: rule table only
    status: not_done
  - id: R-OUT-SCOPE
    text: Scope line items keyed to surfaces
    path: src/roomscan/rules.py
    artifact: none
    status: not_done
  - id: R-OUT-CI
    text: Interval on every measurement
    path: src/roomscan/calibration.py, geometry/backend.py
    artifact: every length/area/height in plan.json is an interval
    status: partial   # fitted from measured errors (LiDAR vs laser 91%, in-sample); see REPORT sec. 7
  - id: R-OUT-CMD
    text: One command per capture
    path: src/roomscan/cli.py
    artifact: roomscan run <capture> --out <dir>
    status: done
  - id: R-OUT-JSON
    text: JSON to published schema
    path: schema/property_plan.schema.json
    artifact: validated in cli.py before writing
    status: done
  - id: R-OUT-RENDER
    text: Rendered plan
    path: src/roomscan/render.py
    artifact: plan.svg
    status: done
  - id: R-GATE-REPEAT
    text: Repeatability <=1 cm or 0.5% per wall
    path: src/roomscan/bench/repeat.py
    artifact: fixloop/after/repeatability_lidar.md
    status: done (measured; gate FAILS: 2/20)
  - id: R-GATE-DRIFT
    text: Drift handling + on/off ablation
    path: src/roomscan/geometry/drift.py
    artifact: benchmark/results/drift_ablation_*.log, docs/REPORT.md sec. 3
    status: partial   # pose graph + verified revisit loops, ON by default, ablated; no measured benefit on sample data
  - id: R-GATE-ACCURACY
    text: Opening/ceiling/wall accuracy vs ground truth
    path: n/a
    artifact: benchmark/results/own/laser_gt_*.json, benchmark/results/FINAL_RESULTS.md
    status: done (measured; gates FAIL: walls median 20.5 cm, doors median 11.5 cm)
  - id: R-H2H
    text: Head-to-head vs consumer app
    path: n/a
    artifact: n/a
    status: not_done  # no LiDAR device available to run a consumer app on any benchmark room
  - id: R-FIX
    text: Fix declaration, shipped fix, regenerable before/after, diff
    path: fixloop/
    artifact: FIX_DECLARATION.md, POSTMORTEM.md, before/, after/, after/fix.diff, tags fixloop-before/after
    status: done (gate not passed; prediction wrong; post-mortem)
  - id: R-REPRO
    text: Reproduction bundle
    path: reproduction/run_all.ps1, reproduction/fixloop.ps1, cache/ (deterministic)
    artifact: out/bench/*, timing.csv
    status: done
  - id: R-README
    text: README to running in < 15 min
    path: README.md
    artifact: uv sync + one command
    status: done
  - id: R-REPORT
    text: Technical report <= 6 pages
    path: docs/REPORT.md
    artifact: docs/REPORT.md (~5-6 pages)
    status: done
  - id: R-PROC
    text: Incremental commit history
    path: .git
    artifact: git log (20+ commits, tags fixloop-before/after)
    status: done

  - id: R-OWN-BENCH
    text: Own benchmark with ground truth (multi-room, damaged room, all tiers, repeat capture)
    path: reproduction/get_arkitscenes.ps1, scripts/arkitscenes_to_stray.py, scripts/laser_gt.py
    artifact: own_benchmark/ (converted), benchmark/results/own/*
    status: partial   # laser GT + 3 repeat captures + all tiers; no staged damage, no own capture, not a 3-room+connector layout
