[project]
name = "roomscan"
version = "0.1.0"
description = "Phone capture to calibrated whole-property floor plan and damage report"
requires-python = ">=3.10,<3.14"

[project.scripts]
roomscan = "roomscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
