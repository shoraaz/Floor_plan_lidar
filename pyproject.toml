[project]
name = "roomscan"
version = "0.1.0"
description = "Phone capture to calibrated whole-property floor plan and damage report"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "opencv-python",
    "open3d>=0.19",
    "pillow",
    "pyyaml",
    "jsonschema",
    "shapely",
    "networkx",
    "click",
    "tqdm",
    "matplotlib",
    "svgwrite",
    "torch>=2.7",
    "torchvision",
    "transformers>=4.45",
    "huggingface_hub",
    "pycolmap",
    "depth-anything-3>=0.1.1",
    "addict>=2.4.0",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
roomscan = "roomscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# RTX 50-series (Blackwell) needs CUDA 12.8+ PyTorch wheels
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
